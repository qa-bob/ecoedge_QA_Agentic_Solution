name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Override site URL (leave blank to use site.config.json)'
        required: false
        default: ''

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Playwright (${{ matrix.project }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome, tablet]
        suite:
          - '--grep @smoke'
          - '--grep @navigation'
          - '--grep @forms'
          - '--grep @functional'
          - '--grep @responsive'
        exclude:
          # Reduce matrix: run non-smoke suites on desktop only to save CI minutes
          - project: mobile-chrome
            suite: '--grep @navigation'
          - project: mobile-chrome
            suite: '--grep @forms'
          - project: mobile-chrome
            suite: '--grep @functional'
          - project: tablet
            suite: '--grep @navigation'
          - project: tablet
            suite: '--grep @forms'
          - project: tablet
            suite: '--grep @functional'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests — ${{ matrix.project }} ${{ matrix.suite }}
        run: npx playwright test ${{ matrix.suite }} --project=${{ matrix.project }}
        env:
          CI: 'true'
          SITE_URL: ${{ github.event.inputs.site_url || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: Visual Regression (desktop)
    needs: typecheck
    runs-on: ubuntu-latest
    # Visual tests only run on main to avoid noise on PRs
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore visual baselines
        uses: actions/cache@v4
        with:
          path: __snapshots__
          key: visual-baselines-${{ hashFiles('site.config.json') }}
          restore-keys: visual-baselines-

      - name: Run visual regression tests
        run: npx playwright test --grep @visual --project=chromium-desktop
        env:
          CI: 'true'
          SITE_URL: ${{ github.event.inputs.site_url || '' }}

      - name: Upload visual results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 7
